name: Deploy Website

on:
  push:
    branches: [main]
  workflow_dispatch:

# CUSTOMIZE: Set these in your repository's Variables settings
# Settings > Secrets and variables > Actions > Variables
#   SITE_DOMAIN: your-domain.com
#   SSH_HOSTNAME: ssh.your-domain.com
#   DEPLOY_USER: deploy
#   SITE_NAME: site identifier for dmz-site-deploy (default: adolago.xyz)
#   SITE_ROOT: document root for payload sync (default: /var/www/html)

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      SSH_HOSTNAME: ${{ vars.SSH_HOSTNAME || 'ssh.adolago.xyz' }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      SITE_NAME: ${{ vars.SITE_NAME || 'adolago.xyz' }}
      SITE_ROOT: ${{ vars.SITE_ROOT || '/var/www/html' }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb -o cloudflared.deb
          sudo dpkg -i cloudflared.deb

      - name: Deploy via Cloudflare Access (SSH)
        run: |
          set -euo pipefail

          # Write deploy key
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DMZ_GATEWAY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Configure SSH client to use local tunnel port
          printf '%s\n' \
            'Host dmz-gateway' \
            '  HostName localhost' \
            '  Port 2222' \
            "  User $DEPLOY_USER" \
            '  IdentityFile ~/.ssh/deploy_key' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking no' \
            '  UserKnownHostsFile /dev/null' >> ~/.ssh/config

          # Start Cloudflare Access TCP tunnel (logs to file so we can print on failure)
          step_ok=0
          CF_PID=""
          ARCHIVE=""
          cleanup() {
            if [ -n "${CF_PID}" ]; then
              kill "${CF_PID}" 2>/dev/null || true
            fi
            if [ -n "${ARCHIVE}" ]; then
              rm -f "${ARCHIVE}" 2>/dev/null || true
            fi
            if [ "${step_ok}" -eq 0 ]; then
              echo "---- cloudflared log (last 200 lines) ----"
              tail -200 /tmp/cloudflared.log 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          echo "Starting Cloudflare Access TCP tunnel..."
          cloudflared access tcp \
            --hostname "$SSH_HOSTNAME" \
            --url localhost:2222 \
            --service-token-id "$CF_ACCESS_CLIENT_ID" \
            --service-token-secret "$CF_ACCESS_CLIENT_SECRET" \
            --loglevel debug \
            --logfile /tmp/cloudflared.log &
          CF_PID=$!

          echo "Testing SSH connection through tunnel..."
          tunnel_ok=0
          for i in {1..12}; do
            if ssh -o ConnectTimeout=20 dmz-gateway 'echo "Connection OK"'; then
              tunnel_ok=1
              echo "Tunnel is ready"
              break
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done

          if [ "$tunnel_ok" -ne 1 ]; then
            echo "Failed to establish tunnel connection"
            exit 1
          fi

          echo "Uploading and deploying site payload..."
          ARCHIVE="$(mktemp /tmp/site-payload.XXXXXX.tgz)"
          tar -czf "$ARCHIVE" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '*.example' \
            .
          scp -o ConnectTimeout=20 "$ARCHIVE" dmz-gateway:/tmp/site-payload.tgz
          ssh dmz-gateway env SITE_NAME="$SITE_NAME" SITE_ROOT="$SITE_ROOT" 'bash -seuo pipefail -s' <<'REMOTE'
          payload=/tmp/site-payload.tgz
          tmp_dir=""
          deploy_root="$SITE_ROOT"
          cleanup_remote() {
            rm -f "$payload" 2>/dev/null || true
            if [ -n "$tmp_dir" ]; then
              sudo -n rm -rf "$tmp_dir" 2>/dev/null || true
            fi
          }
          trap cleanup_remote EXIT

          # Use wrapper when present, then force a direct payload sync to the
          # deployed document root so stale artifacts cannot survive.
          if [ -e /usr/local/sbin/dmz-site-deploy ]; then
            wrapper_out="$(sudo -n /usr/local/sbin/dmz-site-deploy "$SITE_NAME" < "$payload")"
            printf '%s\n' "$wrapper_out"
            wrapper_root="$(printf '%s\n' "$wrapper_out" | sed -n 's/.* to \(\/[^[:space:]]*\).*/\1/p' | tail -n1)"
            if [ -n "$wrapper_root" ]; then
              deploy_root="$wrapper_root"
            fi
          fi

          tmp_dir="$(mktemp -d)"
          tar -xzf "$payload" -C "$tmp_dir"
          sudo -n mkdir -p "$deploy_root"
          sudo -n rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.gitignore' \
            --exclude '*.example' \
            "$tmp_dir/" "$deploy_root/"
          echo "Payload synced to $deploy_root"
          REMOTE

          step_ok=1

      - name: Health check
        run: |
          # Wait for server to respond
          for i in {1..30}; do
            if curl -sf -L "https://$SITE_DOMAIN/" > /dev/null; then
              echo "Site online at https://$SITE_DOMAIN"; exit 0; fi
            sleep 2
          done
          echo "Site did not become reachable in time" >&2; exit 1

      - name: Content check (removed sections)
        run: |
          page="$(curl -sf -L "https://$SITE_DOMAIN/?verify=$GITHUB_RUN_ID")"
          if printf '%s\n' "$page" | grep -Eiq 'href="#homelab"|>Homelab<|>Network<|>Infrastructure<|>Observability<'; then
            echo "Removed sections are still present in rendered homepage" >&2
            exit 1
          fi
          echo "Content verified: removed sections are absent"
